  <h1>Video & Sound Detection</h1>
  <div class="centered">
    <img id="videoFeed" src="http://localhost:5000/video_feed" width="400" height="400" alt="Video Feed" />
    <div class="detection-metadata">
      
  </div>
  <!-- Detection Metadata -->
  <div class="detection-metadata">
    <h3>Detection Results:</h3>
    <ul id="detectionResults">
      <li>No detections yet...</li>
    </ul>
  </div>
</div>

<script>
  async function fetchDetectionResults() {
    try {
      // Fetch detection results from the API
      const response = await fetch('http://localhost:5000/detection_results');
      const results = await response.json();

      // Update the detection results in the frontend
      const resultsContainer = document.getElementById('detectionResults');
      resultsContainer.innerHTML = ''; // Clear previous results

      if (results.length === 0) {
        resultsContainer.innerHTML = '<li>No detections yet...</li>';
      } else {
        results.forEach(result => {
          const listItem = document.createElement('li');
          listItem.textContent = `Label: ${result.label}, Confidence: ${(result.confidence * 100).toFixed(2)}%, BBox: ${result.bbox}`;
          resultsContainer.appendChild(listItem);
        });
      }
    } catch (error) {
      console.error('Error fetching detection results:', error);
    }
  }

  // Poll for detection results every second
  setInterval(fetchDetectionResults, 1000);
</script>
